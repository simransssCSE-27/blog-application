
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - My Blog</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
            min-height: 100vh;
        }

        /* ============================
           NAVBAR
        ============================ */

        nav {
            background: #111;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .logout-button {
            padding: 9px 18px;
            background: white;
            color: #111;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .logout-button:hover {
            background: #ddd;
        }

        /* ============================
           HEADER
        ============================ */

        .header {
            text-align: center;
            padding: 45px 20px 30px;
        }

        .header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        #welcome {
            color: #777;
            font-size: 17px;
        }

        /* ============================
           BLOG CONTAINER
        ============================ */

        #blogs {
            max-width: 1000px;
            margin: auto;
            padding: 10px 20px 50px;
        }

        .blog-card {
            background: white;
            padding: 28px;
            margin-bottom: 22px;
            border-radius: 12px;
            border: 1px solid #e5e5e5;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.06);
        }

        .blog-card h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .author {
            color: #777;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .content-preview {
            color: #555;
            line-height: 1.6;
        }

        /* ============================
           BUTTONS
        ============================ */

        .button {
            display: inline-block;
            margin-top: 20px;
            margin-right: 8px;
            padding: 10px 16px;
            background: #111;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .button:hover {
            background: #333;
        }

        .delete-button {
            background: #d32f2f;
        }

        .delete-button:hover {
            background: #b71c1c;
        }

        /* ============================
           EMPTY / LOADING MESSAGE
        ============================ */

        .message {
            text-align: center;
            background: white;
            padding: 35px;
            border-radius: 12px;
            color: #777;
        }

        /* ============================
           MOBILE RESPONSIVE
        ============================ */

        @media (max-width: 600px) {

            nav {
                padding: 15px 20px;
            }

            .logo {
                font-size: 19px;
            }

            .logout-button {
                padding: 8px 12px;
            }

            .header {
                padding: 35px 15px 20px;
            }

            .header h1 {
                font-size: 28px;
            }

            #blogs {
                padding: 10px 15px 40px;
            }

            .blog-card {
                padding: 20px;
            }

            .blog-card h2 {
                font-size: 21px;
            }

            .button {
                width: 100%;
                text-align: center;
                margin-right: 0;
            }
        }
    </style>
</head>

<body>

    <!-- ============================
         NAVBAR
    ============================ -->

    <nav>

        <div class="logo">
            My Blog
        </div>

        <button
            class="logout-button"
            onclick="logout()"
        >
            Logout
        </button>

    </nav>


    <!-- ============================
         HEADER
    ============================ -->

    <section class="header">

        <h1>My Dashboard</h1>

        <p id="welcome">
            Loading user...
        </p>

    </section>


    <!-- ============================
         BLOGS
    ============================ -->

    <div id="blogs">

        <div class="message">
            Loading your blogs...
        </div>

    </div>


    <script>

        // ============================
        // CHECK LOGIN
        // ============================

        const token =
            localStorage.getItem("token");

        const savedUser =
            localStorage.getItem("user");


        if (!token) {

            alert("Please login first.");

            window.location.href =
                "login.html";

        }


        // ============================
        // SHOW USER NAME
        // ============================

        if (savedUser) {

            const user =
                JSON.parse(savedUser);

            document.getElementById("welcome")
                .innerText =
                "Welcome back, " +
                user.name +
                "! 👋";

        }


        // ============================
        // LOAD MY BLOGS
        // ============================

        async function loadBlogs() {

            try {

                const response =
                    await fetch(
                        "https://blog-application-1-i7nq.onrender.com",
                        {
                            method: "GET",

                            headers: {
                                "Authorization":
                                    "Bearer " + token
                            }
                        }
                    );


                const data =
                    await response.json();


                // ============================
                // TOKEN EXPIRED
                // ============================

                if (response.status === 401) {

                    localStorage.removeItem("token");
                    localStorage.removeItem("user");

                    alert(
                        "Session expired. Please login again."
                    );

                    window.location.href =
                        "login.html";

                    return;

                }


                const blogsContainer =
                    document.getElementById("blogs");

                blogsContainer.innerHTML = "";


                // ============================
                // NO BLOGS
                // ============================

                if (
                    !data.blogs ||
                    data.blogs.length === 0
                ) {

                    blogsContainer.innerHTML = `

                        <div class="message">

                            <h2>No blogs yet ✍️</h2>

                            <p>
                                You haven't created any blogs yet.
                            </p>

                        </div>

                    `;

                    return;

                }


                // ============================
                // DISPLAY BLOGS
                // ============================

                data.blogs.forEach(blog => {

                    const blogCard =
                        document.createElement("div");

                    blogCard.className =
                        "blog-card";


                    const preview =
                        blog.content.length > 150
                            ? blog.content.substring(0, 150) + "..."
                            : blog.content;


                    blogCard.innerHTML = `

                        <h2>
                            ${blog.title}
                        </h2>

                        <p class="author">
                            By ${blog.author}
                        </p>

                        <p class="content-preview">
                            ${preview}
                        </p>

                        <a
                            class="button"
                            href="blog-details.html?id=${blog._id}"
                        >
                            Read More
                        </a>

                        <a
                            class="button"
                            href="edit-blog.html?id=${blog._id}"
                        >
                            Edit
                        </a>

                        <button
                            class="button delete-button"
                            onclick="deleteBlog('${blog._id}')"
                        >
                            Delete
                        </button>

                    `;


                    blogsContainer.appendChild(
                        blogCard
                    );

                });

            }

            catch (error) {

                console.error(error);

                document.getElementById("blogs")
                    .innerHTML = `

                    <div class="message">

                        <h2>Something went wrong 😕</h2>

                        <p>
                            Unable to load your blogs.
                        </p>

                    </div>

                `;

            }

        }


        // ============================
        // DELETE BLOG
        // ============================

        async function deleteBlog(id) {

            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this blog?"
                );


            if (!confirmDelete) {
                return;
            }


            try {

                const response =
                    await fetch(
                        `https://blog-application-1-i7nq.onrender.com`,
                        {
                            method: "DELETE",

                            headers: {
                                "Authorization":
                                    "Bearer " + token
                            }
                        }
                    );


                const data =
                    await response.json();


                alert(data.message);


                loadBlogs();

            }

            catch (error) {

                console.error(error);

                alert(
                    "Unable to delete blog."
                );

            }

        }


        // ============================
        // LOGOUT
        // ============================

        function logout() {

            localStorage.removeItem("token");

            localStorage.removeItem("user");

            alert(
                "Logged out successfully!"
            );

            window.location.href =
                "login.html";

        }


        // ============================
        // START
        // ============================

        loadBlogs();

    </script>

</body>
</html>
