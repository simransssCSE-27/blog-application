<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;800;900&family=Newsreader:ital,wght@0,400;0,500;1,400;1,500&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">

<style>

  :root{
    --paper: #e7ddc4;
    --paper-card: #f3ecd9;
    --paper-card-2: #ece2c8;
    --ink: #2a2117;
    --ink-soft: #6b6151;
    --stamp: #9c3b2e;
    --olive: #5c6b47;
    --gold: #a9822f;
  }

  *{ box-sizing: border-box; }
  html, body{ margin: 0; padding: 0; }

  body{
    min-height: 100vh;
    background-color: var(--paper);
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(255,255,255,0.35), transparent 60%),
      radial-gradient(ellipse 700px 500px at 110% 30%, rgba(0,0,0,0.05), transparent 60%);
    font-family: 'Newsreader', serif;
    color: var(--ink);
    position: relative;
  }

  body::before{
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.35;
    mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='matrix' values='0 0 0 0 0.16  0 0 0 0 0.13  0 0 0 0 0.09  0 0 0 0.55 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  header.bar{
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 7%;
    border-bottom: 2px solid var(--ink);
  }

  .logo{
    font-family: 'Bitter', serif;
    font-weight: 900;
    font-size: 20px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }

  .logout-btn{
    font-family: 'Courier Prime', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--stamp);
    background: transparent;
    border: 1.5px solid var(--stamp);
    border-radius: 50% / 46%;
    padding: 9px 20px;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
  }

  .logout-btn:hover{ background: var(--stamp); color: var(--paper-card); transform: scale(1.03); }

  .container{
    position: relative;
    z-index: 2;
    max-width: 780px;
    margin: 0 auto;
    padding: 50px 22px 70px;
  }

  .welcome{
    text-align: center;
    margin-bottom: 36px;
  }

  .welcome h1{
    font-family: 'Bitter', serif;
    font-weight: 900;
    font-size: 34px;
    margin: 0 0 8px;
  }

  .welcome p{
    font-size: 16px;
    color: var(--ink-soft);
    font-style: italic;
    margin: 0;
  }

  .create-section{
    background: var(--paper-card);
    border: 1px solid rgba(42,33,23,0.16);
    border-radius: 3px;
    padding: 28px;
    text-align: center;
    margin-bottom: 40px;
    box-shadow: 0 10px 26px -12px rgba(0,0,0,0.2);
    transform: rotate(-0.4deg);
  }

  .create-section h2{
    font-family: 'Newsreader', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 18px;
    margin: 0 0 16px;
    color: var(--ink-soft);
  }

  .create-btn{
    display: inline-block;
    text-decoration: none;
    font-family: 'Bitter', serif;
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--paper-card);
    background: var(--stamp);
    border: 2.5px solid var(--stamp);
    border-radius: 50% / 42%;
    padding: 14px 30px;
    transition: transform 0.18s ease;
  }

  .create-btn:hover{ transform: rotate(-1.5deg) scale(1.03); }

  .blogs-title{
    font-family: 'Courier Prime', monospace;
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 20px;
    border-bottom: 1px dashed rgba(42,33,23,0.3);
    padding-bottom: 10px;
  }

  #blogsContainer{
    display: grid;
    gap: 22px;
  }

  .blog-card{
    background: var(--paper-card);
    border: 1px solid rgba(42,33,23,0.16);
    border-radius: 3px;
    padding: 26px;
    box-shadow: 0 10px 24px -12px rgba(0,0,0,0.18);
    position: relative;
  }

  .blog-card:nth-child(odd){ transform: rotate(-0.3deg); }
  .blog-card:nth-child(even){ transform: rotate(0.4deg); }

  .blog-card h2{
    font-family: 'Bitter', serif;
    font-weight: 800;
    font-size: 20px;
    margin: 0 0 8px;
  }

  .blog-author{
    font-family: 'Courier Prime', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 14px;
  }

  .blog-content{
    color: var(--ink);
    line-height: 1.7;
    white-space: pre-wrap;
    margin-bottom: 20px;
    font-size: 15px;
  }

  .buttons{
    display: flex;
    gap: 10px;
  }

  .edit-btn, .delete-btn{
    font-family: 'Courier Prime', monospace;
    font-size: 11.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border: 1.5px solid;
    background: transparent;
    padding: 9px 16px;
    border-radius: 50% / 46%;
    cursor: pointer;
    transition: background 0.18s ease, color 0.18s ease, transform 0.18s ease;
  }

  .edit-btn{ color: var(--olive); border-color: var(--olive); }
  .edit-btn:hover{ background: var(--olive); color: var(--paper-card); transform: scale(1.03); }

  .delete-btn{ color: var(--stamp); border-color: var(--stamp); }
  .delete-btn:hover{ background: var(--stamp); color: var(--paper-card); transform: scale(1.03); }

  .error{
    background: var(--paper-card);
    border: 1px dashed rgba(42,33,23,0.3);
    border-radius: 3px;
    padding: 40px;
    text-align: center;
    color: var(--ink-soft);
  }

  .error h2{
    font-family: 'Bitter', serif;
    color: var(--ink);
    margin-top: 0;
  }

  @media (max-width: 600px){
    .welcome h1{ font-size: 27px; }
    header.bar{ padding: 18px 5%; }
    .container{ width: 100%; }
  }

</style>
</head>

<body>

<header class="bar">
    <div class="logo">My Blog</div>
    <button class="logout-btn" onclick="logout()">Logout</button>
</header>


<div class="container">

    <div class="welcome">
        <h1>My Dashboard</h1>
        <p id="welcomeText">Welcome back — your notebook awaits.</p>
    </div>

    <div class="create-section">
        <h2>Want to share something?</h2>
        <a href="create-blog.html" class="create-btn">Write a Dispatch</a>
    </div>

    <div class="blogs-title">My Blogs</div>

    <div id="blogsContainer">
        <div class="error">Loading your blogs...</div>
    </div>

</div>


<script>

    // ==========================================
    // BACKEND URL
    // ==========================================

    const API_URL = "https://blog-application-1-i7nq.onrender.com";


    // ==========================================
    // GET TOKEN
    // ==========================================

    const token = localStorage.getItem("token");


    // ==========================================
    // CHECK LOGIN
    // ==========================================

    if (!token) {
        window.location.href = "login.html";
    }


    // ==========================================
    // LOAD USER NAME
    // ==========================================

    try {
        const storedUser = localStorage.getItem("user");
        if (storedUser) {
            const user = JSON.parse(storedUser);
            if (user.name) {
                document.getElementById("welcomeText").innerText =
                    `Welcome back, ${user.name} — your notebook awaits.`;
            }
        }
    } catch (error) {
        console.log("Unable to load user information");
    }


    // ==========================================
    // LOAD MY BLOGS
    // ==========================================

    async function loadBlogs() {

        const container = document.getElementById("blogsContainer");

        try {

            const response = await fetch(`${API_URL}/api/my-blogs`, {
                method: "GET",
                headers: { "Authorization": "Bearer " + token }
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.message || "Unable to load blogs");
            }

            container.innerHTML = "";

            if (!data.blogs || data.blogs.length === 0) {

                container.innerHTML = `
                    <div class="error">
                        <h2>No blogs yet</h2>
                        <p style="margin: 10px 0 20px;">
                            You haven't created any blogs.
                        </p>
                        <a href="create-blog.html" class="create-btn">
                            Write Your First Dispatch
                        </a>
                    </div>
                `;

                return;
            }

            data.blogs.forEach(blog => {

                const card = document.createElement("div");
                card.className = "blog-card";

                card.innerHTML = `
                    <h2>${escapeHTML(blog.title)}</h2>
                    <div class="blog-author">By ${escapeHTML(blog.author || "You")}</div>
                    <div class="blog-content">${escapeHTML(blog.content)}</div>
                    <div class="buttons">
                        <button class="edit-btn" onclick="editBlog('${blog._id}')">Edit</button>
                        <button class="delete-btn" onclick="deleteBlog('${blog._id}')">Delete</button>
                    </div>
                `;

                container.appendChild(card);
            });

        } catch (error) {

            console.error(error);

            container.innerHTML = `
                <div class="error">
                    <h2>Something went wrong</h2>
                    <p>Unable to load your blogs.</p>
                    <p style="margin-top:10px;color:#999;">${error.message}</p>
                </div>
            `;
        }
    }


    // ==========================================
    // DELETE BLOG
    // ==========================================

    async function deleteBlog(id) {

        const confirmDelete = confirm("Are you sure you want to delete this blog?");
        if (!confirmDelete) { return; }

        try {

            const response = await fetch(`${API_URL}/api/blogs/${id}`, {
                method: "DELETE",
                headers: { "Authorization": "Bearer " + token }
            });

            const data = await response.json();

            if (!response.ok) {
                alert(data.message || "Unable to delete blog");
                return;
            }

            alert("Blog deleted successfully!");
            loadBlogs();

        } catch (error) {
            console.error(error);
            alert("Server error while deleting blog.");
        }
    }


    // ==========================================
    // EDIT BLOG
    // ==========================================

    function editBlog(id) {
        window.location.href = `edit-blog.html?id=${id}`;
    }


    // ==========================================
    // LOGOUT
    // ==========================================

    function logout() {
        localStorage.removeItem("token");
        localStorage.removeItem("user");
        window.location.href = "login.html";
    }


    // ==========================================
    // HTML SAFETY
    // ==========================================

    function escapeHTML(text) {
        if (!text) { return ""; }
        return String(text)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    // ==========================================
    // START
    // ==========================================

    loadBlogs();

</script>

</body>
</html>
