<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Dashboard - My Blog</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        #welcome {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        #blogs {
            max-width: 900px;
            margin: auto;
        }

        .blog-card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        .blog-card h2 {
            margin-top: 0;
        }

        .author {
            color: #777;
            margin-bottom: 15px;
        }

        .button {
            display: inline-block;
            margin-top: 15px;
            margin-right: 8px;
            padding: 10px 15px;
            background: #222;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .button:hover {
            background: #444;
        }

        .delete-button {
            background: #c62828;
        }

        .delete-button:hover {
            background: #a51f1f;
        }

        .logout-button {
            display: block;
            margin: 0 auto 25px auto;
            padding: 10px 20px;
            background: #222;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .logout-button:hover {
            background: #444;
        }
    </style>
</head>

<body>

    <h1>My Blog Dashboard</h1>

    <p id="welcome"></p>

    <button
        class="logout-button"
        onclick="logout()"
    >
        Logout
    </button>

    <div id="blogs">
        <p>Loading your blogs...</p>
    </div>


    <script>

        // ============================
        // CHECK LOGIN
        // ============================

        const token = localStorage.getItem("token");

        const savedUser =
            localStorage.getItem("user");

        if (!token) {

            alert("Please login first.");

            window.location.href = "login.html";

        }


        // ============================
        // SHOW USER NAME
        // ============================

        if (savedUser) {

            const user =
                JSON.parse(savedUser);

            document.getElementById("welcome").innerText =
                "Welcome, " + user.name + "!";

        }


        // ============================
        // LOAD MY BLOGS
        // ============================

        async function loadBlogs() {

            try {

                const response = await fetch(
                    "http://localhost:5000/api/my-blogs",
                    {
                        method: "GET",

                        headers: {
                            "Authorization":
                                "Bearer " + token
                        }
                    }
                );

                const data =
                    await response.json();

                // Token invalid/expired
                if (response.status === 401) {

                    localStorage.removeItem("token");
                    localStorage.removeItem("user");

                    alert("Session expired. Please login again.");

                    window.location.href =
                        "login.html";

                    return;
                }


                const blogsContainer =
                    document.getElementById("blogs");

                blogsContainer.innerHTML = "";


                // No blogs
                if (!data.blogs ||
                    data.blogs.length === 0) {

                    blogsContainer.innerHTML =
                        "<p>You haven't created any blogs yet.</p>";

                    return;
                }


                // Display blogs
                data.blogs.forEach(blog => {

                    const blogCard =
                        document.createElement("div");

                    blogCard.className =
                        "blog-card";

                    blogCard.innerHTML = `

                        <h2>${blog.title}</h2>

                        <p class="author">
                            By ${blog.author}
                        </p>

                        <p>
                            ${blog.content.substring(0, 150)}...
                        </p>

                        <a
                            class="button"
                            href="blog-details.html?id=${blog._id}"
                        >
                            Read More
                        </a>

                        <a
                            class="button"
                            href="edit-blog.html?id=${blog._id}"
                        >
                            Edit
                        </a>

                        <button
                            class="button delete-button"
                            onclick="deleteBlog('${blog._id}')"
                        >
                            Delete
                        </button>

                    `;

                    blogsContainer.appendChild(
                        blogCard
                    );

                });

            } catch (error) {

                console.error(error);

                document.getElementById("blogs").innerHTML =
                    "<p>Unable to load your blogs.</p>";

            }

        }


        // ============================
        // DELETE BLOG
        // ============================

        async function deleteBlog(id) {

            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this blog?"
                );

            if (!confirmDelete) {
                return;
            }

            try {

                const response = await fetch(
                    `http://localhost:5000/api/blogs/${id}`,
                    {
                        method: "DELETE",

                        headers: {
                            "Authorization":
                                "Bearer " + token
                        }
                    }
                );

                const data =
                    await response.json();

                alert(data.message);

                loadBlogs();

            } catch (error) {

                console.error(error);

                alert("Unable to delete blog.");

            }

        }


        // ============================
        // LOGOUT
        // ============================

        function logout() {

            localStorage.removeItem("token");

            localStorage.removeItem("user");

            alert("Logged out successfully!");

            window.location.href =
                "login.html";

        }


        // ============================
        // START
        // ============================

        loadBlogs();

    </script>

</body>
</html>
