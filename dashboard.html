<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6fb;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            margin: 0;
        }

        .logout-btn {
            background: white;
            color: #111;
            border: none;
            padding: 12px 22px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .logout-btn:hover {
            background: #ddd;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
        }

        .welcome {
            text-align: center;
            margin-bottom: 30px;
        }

        .welcome h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .welcome p {
            font-size: 18px;
            color: #666;
        }

        .create-section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .create-btn {
            display: inline-block;
            text-decoration: none;
            background: #111;
            color: white;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
        }

        .create-btn:hover {
            background: #333;
        }

        .blogs-title {
            margin-bottom: 20px;
            font-size: 28px;
        }

        #blogsContainer {
            display: grid;
            gap: 20px;
        }

        .blog-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .blog-card h2 {
            margin-bottom: 10px;
        }

        .blog-author {
            color: #777;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .blog-content {
            color: #444;
            line-height: 1.6;
            white-space: pre-wrap;
            margin-bottom: 20px;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        .edit-btn,
        .delete-btn {
            border: none;
            padding: 10px 18px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .edit-btn {
            background: #e8e8e8;
            color: #111;
        }

        .delete-btn {
            background: #d9534f;
            color: white;
        }

        .error {
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            color: #777;
        }

        @media (max-width: 600px) {
            .welcome h1 {
                font-size: 32px;
            }

            header {
                padding: 18px 5%;
            }

            .container {
                width: 94%;
            }
        }
    </style>
</head>

<body>

<header>
    <h2>My Blog</h2>

    <button class="logout-btn" onclick="logout()">
        Logout
    </button>
</header>


<div class="container">

    <!-- WELCOME -->

    <div class="welcome">

        <h1>My Dashboard</h1>

        <p id="welcomeText">
            Welcome back! 👋
        </p>

    </div>


    <!-- CREATE BLOG -->

    <div class="create-section">

        <h2 style="margin-bottom: 15px;">
            Want to share something?
        </h2>

        <a href="create-blog.html" class="create-btn">
            ✍️ Create Blog
        </a>

    </div>


    <!-- MY BLOGS -->

    <h2 class="blogs-title">
        My Blogs
    </h2>

    <div id="blogsContainer">

        <div class="error">
            Loading your blogs...
        </div>

    </div>

</div>


<script>

    // ==========================================
    // BACKEND URL
    // ==========================================

    const API_URL =
        "https://blog-application-1-i7nq.onrender.com";


    // ==========================================
    // GET TOKEN
    // ==========================================

    const token = localStorage.getItem("token");


    // ==========================================
    // CHECK LOGIN
    // ==========================================

    if (!token) {

        window.location.href = "login.html";

    }


    // ==========================================
    // LOAD USER NAME
    // ==========================================

    try {

        const storedUser = localStorage.getItem("user");

        if (storedUser) {

            const user = JSON.parse(storedUser);

            if (user.name) {

                document.getElementById("welcomeText").innerText =
                    `Welcome back, ${user.name}! 👋`;

            }

        }

    } catch (error) {

        console.log("Unable to load user information");

    }


    // ==========================================
    // LOAD MY BLOGS
    // ==========================================

    async function loadBlogs() {

        const container =
            document.getElementById("blogsContainer");

        try {

            const response = await fetch(
                `${API_URL}/api/my-blogs`,
                {
                    method: "GET",

                    headers: {
                        "Authorization": "Bearer " + token
                    }
                }
            );


            const data = await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message || "Unable to load blogs"
                );

            }


            container.innerHTML = "";


            if (!data.blogs || data.blogs.length === 0) {

                container.innerHTML = `
                    <div class="error">

                        <h2>No blogs yet 📝</h2>

                        <p style="margin: 10px 0 20px;">
                            You haven't created any blogs.
                        </p>

                        <a href="create-blog.html"
                           class="create-btn">
                            Create Your First Blog
                        </a>

                    </div>
                `;

                return;

            }


            data.blogs.forEach(blog => {

                const card =
                    document.createElement("div");

                card.className = "blog-card";


                card.innerHTML = `

                    <h2>
                        ${escapeHTML(blog.title)}
                    </h2>

                    <div class="blog-author">
                        By ${escapeHTML(blog.author || "You")}
                    </div>

                    <div class="blog-content">
                        ${escapeHTML(blog.content)}
                    </div>

                    <div class="buttons">

                        <button
                            class="edit-btn"
                            onclick="editBlog('${blog._id}')">
                            ✏️ Edit
                        </button>

                        <button
                            class="delete-btn"
                            onclick="deleteBlog('${blog._id}')">
                            🗑️ Delete
                        </button>

                    </div>

                `;


                container.appendChild(card);

            });


        } catch (error) {

            console.error(error);

            container.innerHTML = `

                <div class="error">

                    <h2>
                        Something went wrong 😟
                    </h2>

                    <p>
                        Unable to load your blogs.
                    </p>

                    <p style="margin-top:10px;color:#999;">
                        ${error.message}
                    </p>

                </div>

            `;

        }

    }


    // ==========================================
    // DELETE BLOG
    // ==========================================

    async function deleteBlog(id) {

        const confirmDelete =
            confirm("Are you sure you want to delete this blog?");


        if (!confirmDelete) {
            return;
        }


        try {

            const response = await fetch(
                `${API_URL}/api/blogs/${id}`,
                {
                    method: "DELETE",

                    headers: {
                        "Authorization": "Bearer " + token
                    }
                }
            );


            const data = await response.json();


            if (!response.ok) {

                alert(
                    data.message || "Unable to delete blog"
                );

                return;

            }


            alert("Blog deleted successfully!");


            loadBlogs();


        } catch (error) {

            console.error(error);

            alert("Server error while deleting blog.");

        }

    }


    // ==========================================
    // EDIT BLOG
    // ==========================================

    function editBlog(id) {

        window.location.href =
            `edit-blog.html?id=${id}`;

    }


    // ==========================================
    // LOGOUT
    // ==========================================

    function logout() {

        localStorage.removeItem("token");

        localStorage.removeItem("user");

        window.location.href = "login.html";

    }


    // ==========================================
    // HTML SAFETY
    // ==========================================

    function escapeHTML(text) {

        if (!text) {
            return "";
        }

        return String(text)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    // ==========================================
    // START
    // ==========================================

    loadBlogs();

</script>

</body>
</html>
