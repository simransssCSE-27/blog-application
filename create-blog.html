<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Create Blog</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6fb;
            color: #222;
        }


        header {
            background: #111;
            color: white;
            padding: 20px 7%;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }


        header a {
            color: white;
            text-decoration: none;
        }


        .container {
            width: 90%;
            max-width: 800px;
            margin: 50px auto;
        }


        .card {
            background: white;
            padding: 35px;
            border-radius: 15px;

            box-shadow:
                0 3px 15px rgba(0,0,0,0.08);
        }


        h1 {
            margin-bottom: 30px;
            text-align: center;
        }


        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }


        input,
        textarea {

            width: 100%;

            padding: 14px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 16px;

            margin-bottom: 20px;

            outline: none;
        }


        input:focus,
        textarea:focus {
            border-color: #111;
        }


        textarea {

            min-height: 250px;

            resize: vertical;

        }


        button {

            width: 100%;

            padding: 14px;

            background: #111;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

        }


        button:hover {
            background: #333;
        }


        .back {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #111;

            text-decoration: none;

        }


        #message {

            text-align: center;

            margin-top: 20px;

            font-weight: bold;

        }

    </style>

</head>


<body>


<header>

    <h2>My Blog</h2>

    <a href="dashboard.html">
        ← Dashboard
    </a>

</header>


<div class="container">

    <div class="card">

        <h1>
            Create New Blog ✍️
        </h1>


        <form id="blogForm">


            <label for="title">
                Blog Title
            </label>

            <input
                type="text"
                id="title"
                placeholder="Enter your blog title"
                required
            >


            <label for="content">
                Blog Content
            </label>

            <textarea
                id="content"
                placeholder="Write your thoughts, ideas and stories..."
                required
            ></textarea>


            <button
                type="submit"
                id="publishBtn">

                Publish Blog 🚀

            </button>


        </form>


        <div id="message"></div>


        <a
            href="dashboard.html"
            class="back">

            ← Back to Dashboard

        </a>

    </div>

</div>


<script>


    // ==========================================
    // BACKEND URL
    // ==========================================

    const API_URL =
        "https://blog-application-1-i7nq.onrender.com";


    // ==========================================
    // TOKEN
    // ==========================================

    const token =
        localStorage.getItem("token");


    // ==========================================
    // CHECK LOGIN
    // ==========================================

    if (!token) {

        window.location.href =
            "login.html";

    }


    // ==========================================
    // FORM
    // ==========================================

    const form =
        document.getElementById("blogForm");


    const message =
        document.getElementById("message");


    const publishBtn =
        document.getElementById("publishBtn");


    // ==========================================
    // CREATE BLOG
    // ==========================================

    form.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const title =
                document.getElementById("title")
                    .value
                    .trim();


            const content =
                document.getElementById("content")
                    .value
                    .trim();


            if (!title || !content) {

                message.innerText =
                    "Please fill all fields.";

                message.style.color =
                    "red";

                return;

            }


            publishBtn.disabled = true;

            publishBtn.innerText =
                "Publishing...";


            try {

                const response =
                    await fetch(
                        `${API_URL}/api/create-blog`,
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "Authorization":
                                    "Bearer " + token

                            },

                            body: JSON.stringify({

                                title: title,

                                content: content

                            })

                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Unable to create blog"
                    );

                }


                message.innerText =
                    "Blog created successfully! 🎉";


                message.style.color =
                    "green";


                form.reset();


                setTimeout(
                    function() {

                        window.location.href =
                            "dashboard.html";

                    },
                    1000
                );


            } catch (error) {

                console.error(error);


                message.innerText =
                    error.message ||
                    "Server error";


                message.style.color =
                    "red";


                publishBtn.disabled =
                    false;


                publishBtn.innerText =
                    "Publish Blog 🚀";

            }

        }
    );

</script>


</body>

</html>
