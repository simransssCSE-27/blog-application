<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Blog</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            width: 500px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            height: 150px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #222;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Create Your Blog</h1>

        <form id="blogForm">

            <label for="title">Blog Title</label>

            <input
                type="text"
                id="title"
                placeholder="Enter blog title"
                required
            >

            <label for="author">Author</label>

            <input
                type="text"
                id="author"
                placeholder="Enter your name"
                required
            >

            <label for="content">Blog Content</label>

            <textarea
                id="content"
                placeholder="Write your blog..."
                required
            ></textarea>

            <button type="submit">
                Create Blog
            </button>

        </form>

    </div>


    <script>

        document
            .getElementById("blogForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const title =
                    document.getElementById("title").value;

                const author =
                    document.getElementById("author").value;

                const content =
                    document.getElementById("content").value;

                try {

                    const response = await fetch(
                        "http://localhost:5000/api/create-blog",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({
                                title: title,
                                content: content,
                                author: author
                            })
                        }
                    );

                    const data = await response.json();

                    alert(data.message);

                    console.log(data);

                } catch (error) {

                    console.error(error);

                    alert("Unable to connect to server.");

                }

            });

    </script>

</body>
</html>
