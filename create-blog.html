<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Blog - My Blog</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            min-height: 100vh;
            color: #222;
        }

        nav {
            background: #111;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .nav-buttons a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
        }

        .nav-buttons a:hover {
            color: #ccc;
        }

        .container {
            max-width: 700px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.07);
            border: 1px solid #e5e5e5;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #111;
        }

        textarea {
            min-height: 220px;
            resize: vertical;
            line-height: 1.6;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #111;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        @media (max-width: 600px) {

            nav {
                padding: 15px 20px;
            }

            .logo {
                font-size: 19px;
            }

            .nav-buttons a {
                margin-left: 10px;
                font-size: 13px;
            }

            .container {
                margin: 25px auto;
                padding: 0 15px;
            }

            .form-card {
                padding: 22px;
            }

            h1 {
                font-size: 25px;
            }

            textarea {
                min-height: 180px;
            }
        }
    </style>
</head>

<body>

    <nav>

        <div class="logo">
            My Blog
        </div>

        <div class="nav-buttons">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="index.html">
                Home
            </a>

        </div>

    </nav>


    <div class="container">

        <div class="form-card">

            <h1>Create a New Blog ✍️</h1>

            <p class="subtitle">
                Share your thoughts with the world.
            </p>

            <form id="blogForm">

                <label for="title">
                    Blog Title
                </label>

                <input
                    type="text"
                    id="title"
                    placeholder="Enter your blog title"
                    required
                >

                <label for="author">
                    Author
                </label>

                <input
                    type="text"
                    id="author"
                    placeholder="Enter your name"
                    required
                >

                <label for="content">
                    Blog Content
                </label>

                <textarea
                    id="content"
                    placeholder="Start writing your blog..."
                    required
                ></textarea>

                <button type="submit">
                    Publish Blog
                </button>

            </form>

        </div>

    </div>


    <script>

        // ============================
        // BACKEND URL
        // ============================

        const API_URL =
            "https://blog-application-1-i7nq.onrender.com";


        // ============================
        // CHECK LOGIN
        // ============================

        const token =
            localStorage.getItem("token");

        const savedUser =
            localStorage.getItem("user");


        if (!token) {

            alert("Please login first.");

            window.location.href =
                "login.html";

        }


        // ============================
        // AUTO-FILL AUTHOR
        // ============================

        if (savedUser) {

            const user =
                JSON.parse(savedUser);

            document.getElementById("author").value =
                user.name;

        }


        // ============================
        // CREATE BLOG
        // ============================

        document
            .getElementById("blogForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const title =
                        document.getElementById("title").value;

                    const author =
                        document.getElementById("author").value;

                    const content =
                        document.getElementById("content").value;


                    try {

                        const response =
                            await fetch(
                                API_URL + "/api/create-blog",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json",

                                        "Authorization":
                                            "Bearer " + token
                                    },

                                    body: JSON.stringify({
                                        title: title,
                                        content: content,
                                        author: author
                                    })
                                }
                            );


                        const data =
                            await response.json();


                        // ============================
                        // SESSION EXPIRED
                        // ============================

                        if (response.status === 401) {

                            localStorage.removeItem("token");
                            localStorage.removeItem("user");

                            alert(
                                "Session expired. Please login again."
                            );

                            window.location.href =
                                "login.html";

                            return;

                        }


                        alert(data.message);


                        // ============================
                        // SUCCESS
                        // ============================

                        if (response.ok) {

                            window.location.href =
                                "dashboard.html";

                        }

                    }

                    catch (error) {

                        console.error(error);

                        alert(
                            "Unable to connect to server."
                        );

                    }

                }
            );

    </script>

</body>
</html>
