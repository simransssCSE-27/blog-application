<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - My Blog</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;800;900&family=Newsreader:ital,wght@0,400;0,500;1,400;1,500&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">

<style>

  :root{
    --paper: #e7ddc4;
    --paper-card: #f3ecd9;
    --paper-card-2: #ece2c8;
    --ink: #2a2117;
    --ink-soft: #6b6151;
    --stamp: #9c3b2e;
    --stamp-dark: #7c2e23;
    --olive: #5c6b47;
    --gold: #a9822f;
    --error: #9c3b2e;
    --success: #4f6b3f;
  }

  *{ box-sizing: border-box; }

  html, body{ margin: 0; padding: 0; }

  body{
    min-height: 100vh;
    background-color: var(--paper);
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(255,255,255,0.35), transparent 60%),
      radial-gradient(ellipse 700px 500px at 110% 110%, rgba(0,0,0,0.05), transparent 60%);
    font-family: 'Newsreader', serif;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
    position: relative;
  }

  body::before{
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.35;
    mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='matrix' values='0 0 0 0 0.16  0 0 0 0 0.13  0 0 0 0 0.09  0 0 0 0.55 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  .masthead{
    text-align: center;
    margin-bottom: 30px;
    position: relative;
    z-index: 2;
  }

  .masthead .kicker{
    font-family: 'Courier Prime', monospace;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--stamp);
    margin-bottom: 6px;
  }

  .masthead h2{
    font-family: 'Bitter', serif;
    font-weight: 900;
    font-size: 26px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    margin: 0;
    border-top: 2px solid var(--ink);
    border-bottom: 2px solid var(--ink);
    padding: 6px 4px;
    display: inline-block;
  }

  .stage{
    position: relative;
    width: 100%;
    max-width: 400px;
    z-index: 2;
  }

  .stack-behind-1, .stack-behind-2{
    position: absolute;
    inset: 0;
    background: var(--paper-card-2);
    border: 1px solid rgba(42,33,23,0.14);
    border-radius: 3px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
  }

  .stack-behind-1{ transform: rotate(-3.5deg) translateY(4px); }
  .stack-behind-2{ transform: rotate(2.5deg) translateY(2px); background: #efe4c9; }

  .card{
    position: relative;
    background: var(--paper-card);
    border: 1px solid rgba(42,33,23,0.16);
    border-radius: 3px;
    padding: 46px 34px 30px;
    box-shadow:
      0 14px 34px -10px rgba(0,0,0,0.22),
      inset 0 0 0 1px rgba(255,255,255,0.3);
    animation: settle 0.6s cubic-bezier(.2,.8,.3,1) both;
  }

  @keyframes settle{
    from{ opacity: 0; transform: translateY(14px) rotate(-1.2deg) scale(0.98); }
    to{ opacity: 1; transform: translateY(0) rotate(-0.6deg) scale(1); }
  }

  .tape{
    position: absolute;
    top: -16px;
    left: 50%;
    transform: translateX(-50%) rotate(-3deg);
    width: 120px;
    height: 34px;
    background: repeating-linear-gradient(
      45deg,
      rgba(169,130,47,0.55),
      rgba(169,130,47,0.55) 6px,
      rgba(201,168,102,0.55) 6px,
      rgba(201,168,102,0.55) 12px
    );
    opacity: 0.85;
    box-shadow: 0 3px 6px rgba(0,0,0,0.15);
    z-index: 3;
  }

  .issue-badge{
    position: absolute;
    top: 18px;
    right: 20px;
    width: 54px;
    height: 54px;
    border: 1.5px solid var(--stamp);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    transform: rotate(9deg);
    color: var(--stamp);
    opacity: 0.75;
    font-family: 'Courier Prime', monospace;
    text-align: center;
    line-height: 1.1;
  }
  .issue-badge span:first-child{ font-size: 8px; letter-spacing: 0.08em; }
  .issue-badge span:last-child{ font-size: 13px; font-weight: 700; }

  h1.title{
    font-family: 'Bitter', serif;
    font-weight: 800;
    font-size: 27px;
    line-height: 1.2;
    margin: 6px 0 6px;
    max-width: 220px;
  }

  .subtitle{
    font-family: 'Newsreader', serif;
    font-style: italic;
    color: var(--ink-soft);
    font-size: 15px;
    margin: 0 0 30px;
  }

  .field{ margin-bottom: 22px; }

  .field label{
    display: block;
    font-family: 'Courier Prime', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }

  .field input{
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1.5px dashed rgba(42,33,23,0.4);
    padding: 6px 2px 8px;
    font-size: 16px;
    font-family: 'Newsreader', serif;
    color: var(--ink);
    outline: none;
    transition: border-color 0.25s ease, border-style 0.25s ease, background 0.25s ease;
  }

  .field input::placeholder{ color: rgba(42,33,23,0.28); font-style: italic; }

  .field input:focus{
    border-bottom: 1.5px solid var(--stamp);
    background: rgba(156,59,46,0.04);
  }

  .stamp-wrap{
    display: flex;
    justify-content: center;
    margin-top: 32px;
    margin-bottom: 4px;
  }

  button.submit{
    position: relative;
    font-family: 'Bitter', serif;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--stamp);
    background: transparent;
    border: 2.5px solid var(--stamp);
    border-radius: 50% / 42%;
    padding: 16px 38px;
    cursor: pointer;
    transform: rotate(-2deg);
    transition: transform 0.18s ease, background 0.18s ease, color 0.18s ease;
  }

  button.submit::after{
    content: "";
    position: absolute;
    inset: 4px;
    border: 1px solid var(--stamp);
    border-radius: 50% / 42%;
    opacity: 0.6;
    pointer-events: none;
  }

  button.submit:hover{
    transform: rotate(0deg) scale(1.03);
    background: rgba(156,59,46,0.07);
  }

  button.submit:active{
    transform: rotate(0deg) scale(0.92);
    background: var(--stamp);
    color: var(--paper-card);
  }

  button.submit:disabled{
    opacity: 0.55;
    cursor: not-allowed;
    transform: rotate(0deg) scale(0.97);
  }

  .ink-burst{
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(156,59,46,0.35), transparent 70%);
    opacity: 0;
    pointer-events: none;
    transform: scale(0.6);
  }

  button.submit.stamped .ink-burst{
    animation: burst 0.5s ease-out forwards;
  }

  @keyframes burst{
    0%{ opacity: 0.9; transform: scale(0.5); }
    100%{ opacity: 0; transform: scale(1.6); }
  }

  #message{
    text-align: center;
    margin-top: 18px;
    font-family: 'Courier Prime', monospace;
    font-size: 12.5px;
    letter-spacing: 0.03em;
    min-height: 16px;
  }

  .login-link{
    text-align: center;
    margin-top:
