<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog Details</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;800;900&family=Newsreader:ital,wght@0,400;0,500;1,400;1,500&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">

<style>

  :root{
    --paper: #e7ddc4;
    --paper-card: #f3ecd9;
    --ink: #2a2117;
    --ink-soft: #6b6151;
    --stamp: #9c3b2e;
    --olive: #5c6b47;
  }

  *{ box-sizing: border-box; }
  html, body{ margin: 0; padding: 0; }

  body{
    min-height: 100vh;
    background-color: var(--paper);
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(255,255,255,0.35), transparent 60%),
      radial-gradient(ellipse 700px 500px at 110% 30%, rgba(0,0,0,0.05), transparent 60%);
    font-family: 'Newsreader', serif;
    color: var(--ink);
    position: relative;
    padding: 60px 20px;
  }

  body::before{
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.35;
    mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='matrix' values='0 0 0 0 0.16  0 0 0 0 0.13  0 0 0 0 0.09  0 0 0 0.55 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  .container{
    position: relative;
    z-index: 2;
    max-width: 720px;
    margin: 0 auto;
    background: var(--paper-card);
    border: 1px solid rgba(42,33,23,0.16);
    border-radius: 3px;
    padding: 50px 46px;
    box-shadow: 0 18px 40px -16px rgba(0,0,0,0.25);
    transform: rotate(-0.3deg);
  }

  .kicker{
    font-family: 'Courier Prime', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--stamp);
    margin-bottom: 14px;
  }

  h1{
    font-family: 'Bitter', serif;
    font-weight: 900;
    font-size: 34px;
    line-height: 1.2;
    margin: 0 0 14px;
  }

  .author{
    font-family: 'Courier Prime', monospace;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 32px;
    padding-bottom: 24px;
    border-bottom: 1px dashed rgba(42,33,23,0.3);
  }

  .content{
    line-height: 1.9;
    font-size: 18px;
    white-space: pre-wrap;
  }

  .back{
    display: inline-block;
    margin-top: 40px;
    padding: 12px 26px;
    font-family: 'Bitter', serif;
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: var(--olive);
    color: var(--paper-card);
    border: 2px solid var(--olive);
    text-decoration: none;
    border-radius: 50% / 42%;
    transition: transform 0.18s ease;
  }
  .back:hover{ transform: rotate(-1.5deg) scale(1.03); }

  @media (max-width: 560px){
    .container{ padding: 34px 26px; }
    h1{ font-size: 27px; }
  }

</style>
</head>

<body>

    <div class="container" id="blog">
        <p>Loading blog...</p>
    </div>


    <script>

        // ==========================================
        // BACKEND URL
        // ==========================================

        const API_URL = "https://blog-application-1-i7nq.onrender.com";


        async function loadBlog() {

            const params = new URLSearchParams(window.location.search);
            const id = params.get("id");

            if (!id) {
                document.getElementById("blog").innerHTML = "<h2>Blog not found</h2>";
                return;
            }

            try {

                const response = await fetch(`${API_URL}/api/blogs/${id}`);

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message);
                }

                const blog = data.blog;

                document.getElementById("blog").innerHTML = `
                    <div class="kicker">Dispatch</div>
                    <h1>${blog.title}</h1>
                    <p class="author">By ${blog.author}</p>
                    <div class="content">${blog.content}</div>
                    <a href="dashboard.html" class="back">← Back to Blogs</a>
                `;

            } catch (error) {
                console.error(error);
                document.getElementById("blog").innerHTML = "<h2>Unable to load blog</h2>";
            }
        }

        loadBlog();

    </script>

</body>
</html>
