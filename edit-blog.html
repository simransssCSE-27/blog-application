<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Blog</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;800;900&family=Newsreader:ital,wght@0,400;0,500;1,400;1,500&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">

<style>

  :root{
    --paper: #e7ddc4;
    --paper-card: #f3ecd9;
    --ink: #2a2117;
    --ink-soft: #6b6151;
    --stamp: #9c3b2e;
    --olive: #5c6b47;
    --error: #9c3b2e;
    --success: #4f6b3f;
  }

  *{ box-sizing: border-box; }
  html, body{ margin: 0; padding: 0; }

  body{
    min-height: 100vh;
    background-color: var(--paper);
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(255,255,255,0.35), transparent 60%),
      radial-gradient(ellipse 700px 500px at 110% 30%, rgba(0,0,0,0.05), transparent 60%);
    font-family: 'Newsreader', serif;
    color: var(--ink);
    position: relative;
  }

  body::before{
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.35;
    mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='matrix' values='0 0 0 0 0.16  0 0 0 0 0.13  0 0 0 0 0.09  0 0 0 0.55 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  header.bar{
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 7%;
    border-bottom: 2px solid var(--ink);
  }

  .logo{
    font-family: 'Bitter', serif;
    font-weight: 900;
    font-size: 20px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }

  header.bar a{
    font-family: 'Courier Prime', monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }
  header.bar a:hover{ border-color: var(--stamp); color: var(--stamp); }

  .container{
    position: relative;
    z-index: 2;
    width: 90%;
    max-width: 600px;
    margin: 50px auto 70px;
  }

  .card{
    background: var(--paper-card);
    border: 1px solid rgba(42,33,23,0.16);
    border-radius: 3px;
    padding: 40px 36px;
    box-shadow: 0 14px 34px -14px rgba(0,0,0,0.22);
    transform: rotate(0.3deg);
  }

  .kicker{
    font-family: 'Courier Prime', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--olive);
    margin-bottom: 10px;
    text-align: center;
  }

  h1{
    font-family: 'Bitter', serif;
    font-weight: 900;
    font-size: 27px;
    text-align: center;
    margin: 0 0 30px;
  }

  label{
    display: block;
    font-family: 'Courier Prime', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 8px;
    margin-top: 18px;
  }

  input, textarea{
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1.5px dashed rgba(42,33,23,0.4);
    padding: 10px 4px;
    font-size: 16px;
    font-family: 'Newsreader', serif;
    color: var(--ink);
    outline: none;
    transition: border-color 0.25s ease, background 0.25s ease;
  }

  textarea{
    min-height: 180px;
    resize: vertical;
    line-height: 1.7;
    border: 1.5px dashed rgba(42,33,23,0.4);
    border-radius: 3px;
    padding: 14px;
  }

  input:focus, textarea:focus{
    border-color: var(--olive);
    background: rgba(92,107,71,0.05);
  }

  .stamp-wrap{
    display: flex;
    justify-content: center;
    margin-top: 28px;
  }

  button{
    position: relative;
    font-family: 'Bitter', serif;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--paper-card);
    background: var(--olive);
    border: 2.5px solid var(--olive);
    border-radius: 50% / 42%;
    padding: 16px 36px;
    cursor: pointer;
    transform: rotate(1.5deg);
    transition: transform 0.18s ease, opacity 0.18s ease;
  }

  button:hover{ transform: rotate(0deg) scale(1.03); }
  button:disabled{ opacity: 0.6; cursor: not-allowed; transform: none; }

  .back-button{
    display: block;
    text-align: center;
    margin-top: 22px;
    color: var(--ink-soft);
    font-size: 13px;
    text-decoration: none;
    font-family: 'Courier Prime', monospace;
    letter-spacing: 0.05em;
  }
  .back-button:hover{ color: var(--stamp); }

  @media (max-width: 500px){
    .card{ padding: 30px 22px; }
  }

</style>
</head>


<body>

<header class="bar">
    <div class="logo">My Blog</div>
    <a href="dashboard.html">← Dashboard</a>
</header>

<div class="container">

    <div class="card">

        <div class="kicker">Revise Dispatch</div>
        <h1>Edit Blog</h1>

        <form id="editForm">

            <label for="title">Title</label>
            <input type="text" id="title" required>

            <label for="author">Author</label>
            <input type="text" id="author" required>

            <label for="content">Content</label>
            <textarea id="content" required></textarea>

            <div class="stamp-wrap">
                <button type="submit">Update Blog</button>
            </div>

        </form>

        <a href="dashboard.html" class="back-button">← Back to Dashboard</a>

    </div>

</div>


<script>

    // ==========================================
    // BACKEND URL
    // ==========================================

    const API_URL = "https://blog-application-1-i7nq.onrender.com";


    // ============================
    // CHECK LOGIN
    // ============================

    const token = localStorage.getItem("token");

    if (!token) {
        alert("Please login first.");
        window.location.href = "login.html";
    }


    // ============================
    // GET BLOG ID
    // ============================

    const params = new URLSearchParams(window.location.search);
    const blogId = params.get("id");

    if (!blogId) {
        alert("Blog ID not found.");
        window.location.href = "dashboard.html";
    }


    // ============================
    // LOAD BLOG
    // ============================

    async function loadBlog() {

        try {

            const response = await fetch(
                `${API_URL}/api/blogs/${blogId}`,
                {
                    method: "GET",
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                }
            );

            const data = await response.json();

            if (response.status === 401) {
                localStorage.removeItem("token");
                localStorage.removeItem("user");
                alert("Session expired. Please login again.");
                window.location.href = "login.html";
                return;
            }

            if (!response.ok) {
                alert(data.message || "Unable to load blog.");
                return;
            }

            document.getElementById("title").value = data.blog.title;
            document.getElementById("author").value = data.blog.author;
            document.getElementById("content").value = data.blog.content;

        }

        catch (error) {
            console.error(error);
            alert("Unable to connect to server.");
        }
    }


    // ============================
    // UPDATE BLOG
    // ============================

    document.getElementById("editForm").addEventListener("submit", async function(event) {

        event.preventDefault();

        const title = document.getElementById("title").value;
        const author = document.getElementById("author").value;
        const content = document.getElementById("content").value;

        try {

            const response = await fetch(
                `${API_URL}/api/blogs/${blogId}`,
                {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token
                    },
                    body: JSON.stringify({ title, content, author })
                }
            );

            const data = await response.json();

            if (response.status === 401) {
                localStorage.removeItem("token");
                localStorage.removeItem("user");
                alert("Session expired. Please login again.");
                window.location.href = "login.html";
                return;
            }

            alert(data.message);

            if (response.ok) {
                window.location.href = "dashboard.html";
            }

        }

        catch (error) {
            console.error(error);
            alert("Unable to connect to server.");
        }
    });


    // ============================
    // START
    // ============================

    loadBlog();


</script>


</body>

</html>
