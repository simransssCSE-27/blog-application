<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Blog</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 40px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            height: 180px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #222;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Edit Blog</h1>

        <form id="editForm">

            <label>Title</label>

            <input
                type="text"
                id="title"
                required
            >

            <label>Author</label>

            <input
                type="text"
                id="author"
                required
            >

            <label>Content</label>

            <textarea
                id="content"
                required
            ></textarea>

            <button type="submit">
                Update Blog
            </button>

        </form>

    </div>


    <script>

        // Get blog ID from URL
        const params =
            new URLSearchParams(window.location.search);

        const blogId = params.get("id");


        // ============================
        // LOAD BLOG
        // ============================

        async function loadBlog() {

            try {

                const response = await fetch(
                    `http://localhost:5000/api/blogs/${blogId}`
                );

                const data = await response.json();

                document.getElementById("title").value =
                    data.blog.title;

                document.getElementById("author").value =
                    data.blog.author;

                document.getElementById("content").value =
                    data.blog.content;

            } catch (error) {

                console.error(error);

                alert("Unable to load blog.");

            }

        }


        // ============================
        // UPDATE BLOG
        // ============================

        document
            .getElementById("editForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const title =
                    document.getElementById("title").value;

                const author =
                    document.getElementById("author").value;

                const content =
                    document.getElementById("content").value;


                try {

                    const response = await fetch(
                        `http://localhost:5000/api/blogs/${blogId}`,
                        {
                            method: "PUT",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({
                                title: title,
                                content: content,
                                author: author
                            })
                        }
                    );

                    const data = await response.json();

                    alert(data.message);

                    // Go back to dashboard
                    window.location.href =
                        "dashboard.html";

                } catch (error) {

                    console.error(error);

                    alert("Unable to update blog.");

                }

            });


        // Load blog when page opens
        loadBlog();

    </script>

</body>
</html>
