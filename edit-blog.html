<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Blog</title>


    <style>

        * {
            box-sizing: border-box;
        }

        body {

            font-family: Arial, sans-serif;

            background: #f4f6f8;

            margin: 0;

            padding: 40px;

        }


        .container {

            max-width: 600px;

            margin: auto;

            background: white;

            padding: 30px;

            border-radius: 10px;

            box-shadow:
                0 3px 15px rgba(0, 0, 0, 0.1);

        }


        h1 {

            text-align: center;

            margin-bottom: 25px;

        }


        label {

            display: block;

            margin-top: 15px;

            margin-bottom: 5px;

            font-weight: bold;

        }


        input,
        textarea {

            width: 100%;

            padding: 10px;

            border: 1px solid #ccc;

            border-radius: 5px;

            font-size: 15px;

        }


        input:focus,
        textarea:focus {

            outline: none;

            border-color: #555;

        }


        textarea {

            height: 180px;

            resize: vertical;

        }


        button {

            width: 100%;

            margin-top: 20px;

            padding: 12px;

            background: #222;

            color: white;

            border: none;

            border-radius: 5px;

            cursor: pointer;

            font-size: 16px;

        }


        button:hover {

            background: #444;

        }


        .back-button {

            display: block;

            text-align: center;

            margin-top: 15px;

            color: #222;

            text-decoration: none;

        }

    </style>

</head>


<body>


    <div class="container">

        <h1>Edit Blog</h1>


        <form id="editForm">


            <label for="title">
                Title
            </label>

            <input
                type="text"
                id="title"
                required
            >


            <label for="author">
                Author
            </label>

            <input
                type="text"
                id="author"
                required
            >


            <label for="content">
                Content
            </label>

            <textarea
                id="content"
                required
            ></textarea>


            <button type="submit">
                Update Blog
            </button>


        </form>


        <a
            href="dashboard.html"
            class="back-button"
        >
            ← Back to Dashboard
        </a>


    </div>


    <script>


        // ============================
        // CHECK LOGIN
        // ============================

        const token =
            localStorage.getItem("token");


        if (!token) {

            alert("Please login first.");

            window.location.href =
                "login.html";

        }


        // ============================
        // GET BLOG ID
        // ============================

        const params =
            new URLSearchParams(
                window.location.search
            );


        const blogId =
            params.get("id");


        if (!blogId) {

            alert("Blog ID not found.");

            window.location.href =
                "dashboard.html";

        }


        // ============================
        // LOAD BLOG
        // ============================

        async function loadBlog() {

            try {

                const response =
                    await fetch(
                      `https://blog-application-1-i7nq.onrender.com/api/blogs/${blogId}`
                      {
                            method: "GET",

                            headers: {

                                "Authorization":
                                    "Bearer " + token

                            }

                        }
                    );


                const data =
                    await response.json();


                // ============================
                // TOKEN EXPIRED
                // ============================

                if (response.status === 401) {

                    localStorage.removeItem(
                        "token"
                    );

                    localStorage.removeItem(
                        "user"
                    );

                    alert(
                        "Session expired. Please login again."
                    );

                    window.location.href =
                        "login.html";

                    return;

                }


                // ============================
                // ERROR
                // ============================

                if (!response.ok) {

                    alert(
                        data.message ||
                        "Unable to load blog."
                    );

                    return;

                }


                // ============================
                // PUT DATA IN FORM
                // ============================

                document.getElementById(
                    "title"
                ).value = data.blog.title;


                document.getElementById(
                    "author"
                ).value = data.blog.author;


                document.getElementById(
                    "content"
                ).value = data.blog.content;


            }

            catch (error) {

                console.error(error);

                alert(
                    "Unable to connect to server."
                );

            }

        }


        // ============================
        // UPDATE BLOG
        // ============================

        document
            .getElementById("editForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const title =
                        document.getElementById(
                            "title"
                        ).value;


                    const author =
                        document.getElementById(
                            "author"
                        ).value;


                    const content =
                        document.getElementById(
                            "content"
                        ).value;


                    try {

                        const response =
                            await fetch(
                                `https://blog-application-1-i7nq.onrender.com/api/blogs/${blogId}`
                                {

                                    method: "PUT",

                                    headers: {

                                        "Content-Type":
                                            "application/json",

                                        "Authorization":
                                            "Bearer " + token

                                    },

                                    body:
                                        JSON.stringify({

                                            title:
                                                title,

                                            content:
                                                content,

                                            author:
                                                author

                                        })

                                }
                            );


                        const data =
                            await response.json();


                        // ============================
                        // TOKEN EXPIRED
                        // ============================

                        if (
                            response.status === 401
                        ) {

                            localStorage.removeItem(
                                "token"
                            );

                            localStorage.removeItem(
                                "user"
                            );

                            alert(
                                "Session expired. Please login again."
                            );

                            window.location.href =
                                "login.html";

                            return;

                        }


                        // ============================
                        // SHOW MESSAGE
                        // ============================

                        alert(
                            data.message
                        );


                        // ============================
                        // SUCCESS
                        // ============================

                        if (response.ok) {

                            window.location.href =
                                "dashboard.html";

                        }

                    }

                    catch (error) {

                        console.error(error);

                        alert(
                            "Unable to connect to server."
                        );

                    }

                }
            );


        // ============================
        // START
        // ============================

        loadBlog();


    </script>


</body>

</html>
